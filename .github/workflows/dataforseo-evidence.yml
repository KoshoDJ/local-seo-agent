name: DataForSEO evidence checks
on:
  push:
    branches: [engineering/dataforseo-v1]
  pull_request:
jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_dataforseo*.py' -v
